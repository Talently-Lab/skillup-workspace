[build]
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ -z \"$COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git -C .. cat-file -e \"$CACHED_COMMIT_REF^{commit}\" 2>/dev/null || exit 1; git -C .. cat-file -e \"$COMMIT_REF^{commit}\" 2>/dev/null || exit 1; git -C .. diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)backend/**' ':(exclude)docs/**' ':(exclude)README.md' ':(exclude)frontend/README.md'; result=$?; if [ \"$result\" -eq 0 ]; then exit 0; else exit 1; fi"
