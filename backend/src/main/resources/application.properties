spring.application.name=skillup-workspace

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillup_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=512MB

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} %kvp - %msg%n

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

r2.enabled=${R2_ENABLED:true}
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:skillupcampus}
r2.public-url=${R2_PUBLIC_URL:}
r2.presigned-url-duration-seconds=300
r2.max-image-size-bytes=5242880
r2.max-pdf-size-bytes=20971520
r2.max-video-size-bytes=20971520

image.webp.enabled=${IMAGE_WEBP_ENABLED:true}
image.webp.quality=${IMAGE_WEBP_QUALITY:0.80}
image.webp.max-pixels=${IMAGE_WEBP_MAX_PIXELS:20000000}

course.upload.max-concurrent-tasks=${COURSE_UPLOAD_MAX_CONCURRENT_TASKS:2}
course.upload.queue-capacity=${COURSE_UPLOAD_QUEUE_CAPACITY:8}
course.upload.request-wait-timeout-ms=${COURSE_UPLOAD_REQUEST_WAIT_TIMEOUT_MS:10000}